<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memproses Pesanan - Lemakin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333333;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #FF6500;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    h2 {
      font-size: 18px;
      margin: 0 0 8px 0;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      color: #666666;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="loader"></div>
  <h2>Memproses Pesanan Anda...</h2>
  <p>Harap tunggu sebentar, Anda akan segera dialihkan ke WhatsApp.</p>
</body>

</html>
