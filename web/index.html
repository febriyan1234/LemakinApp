<!DOCTYPE html>
<html>
<head>
  <script>
    // Safe unregistration of existing service workers
    if ('serviceWorker' in navigator) {
      try {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        });
      } catch (e) {
        console.warn("Failed to unregister service worker:", e);
      }
    }

    // Intercept Flutter loader to disable service worker registration safely
    window._flutter = {};
    let actualLoader;
    Object.defineProperty(window._flutter, 'loader', {
      get: function() { return actualLoader; },
      set: function(val) {
        if (val) {
          const originalLoad = val.load;
          val.load = function(options) {
            if (options && options.serviceWorkerSettings) {
              delete options.serviceWorkerSettings;
            }
            return originalLoad.call(val, options);
          };
        }
        actualLoader = val;
      },
      configurable: true
    });
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jajanan by Lemakin">

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="logo.png?v=2"/>

  <title>Jajanan by Lemakin</title>
  <link rel="manifest" href="manifest.json?v=2">
  <style>
    /* Force initial loading indicators and progress bars to orange (#FF6500) */
    progress {
      accent-color: #FF6500 !important;
    }
    progress::-webkit-progress-value {
      background-color: #FF6500 !important;
    }
    progress::-moz-progress-bar {
      background-color: #FF6500 !important;
    }
    div[role="progressbar"],
    .progress,
    .progress-bar,
    .progress-bar-fill,
    .progress-fill,
    .flutter-loader,
    .loader,
    .loading,
    .dwds-progress,
    .dwds-loading,
    #loading-indicator,
    #loading {
      background-color: #FF6500 !important;
      color: #FF6500 !important;
      border-top-color: #FF6500 !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
